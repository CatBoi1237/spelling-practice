name: SpellBee CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: https://spelling-practice-api.onrender.com
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test practice modes
        run: node --experimental-vm-modules ../scripts/test-practice-modes.mjs
      - name: Test arcade interactions
        run: yarn test --watchAll=false --runInBand --testPathPattern='(Arcade|LearningTools).test'
      - name: Build frontend
        run: yarn build

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install role-test dependencies
        run: python -m pip install fastapi==0.110.1 'pytest>=8.0.0' pytest-xdist
      - name: Test account roles
        run: python -m pytest -q backend/tests/test_role_switch.py backend/tests/test_learning_expansion.py
